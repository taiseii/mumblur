name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: MumblurCore (swift test)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            MumblurCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('MumblurCore/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Run package tests
        working-directory: MumblurCore
        run: swift test --parallel

  app-build:
    name: App build (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Mumblur (Debug)
        run: |
          xcodebuild \
            -project Mumblur.xcodeproj \
            -scheme Mumblur \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-ci \
            build CODE_SIGNING_ALLOWED=NO | xcpretty -c || exit ${PIPESTATUS[0]}
